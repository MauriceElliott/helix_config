
[language-server.copilot]
command = "copilot-language-server"
args = ["--stdio"]
config = {}

[[language]]
name = "lua"
indent = { tab-width = 4, unit = "    " }
language-servers = ["lua-language-server", "copilot"]

[[language]]
name = "powershell"
indent = { tab-width = 4, unit = "    " }
language-servers = ["powershell-editor-services", "copilot"]

[[language]]
name = "rust"
language-servers = ["rust-analyzer", "copilot"]

[[language]]
name = "python"
language-servers = ["pylsp", "copilot"]

[[language]]
name = "go"
language-servers = ["gopls", "copilot"]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "copilot"]

[[language]]
name = "javascript"
